<!doctype html>
<html lang="en" class="host">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally Room | Split-screen Versus (direction A)</title>
<link rel="stylesheet" href="style.css">
<style>
  .views { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .views .scene { position: relative; inset: auto; min-width: 0; }
  .divider { position: fixed; top: 0; bottom: 0; left: 50%; width: 0.9rem; margin-left: -0.45rem; background: var(--ink); }

  /* one shared score, straddling the divider: points meet in the middle */
  .score { position: absolute; left: 50%; top: 0; transform: translateX(-50%); display: grid; grid-template-columns: 1fr 1fr; padding: 0.45rem; gap: 0.9rem; }
  .score .half { display: grid; align-items: center; gap: 1rem; }
  .score .half.l { grid-template-columns: 1.5rem 1.5rem minmax(11rem, 1fr) 3.4rem 7.25rem; padding-left: 0.9rem; }
  .score .half.r { grid-template-columns: 7.25rem 3.4rem minmax(11rem, 1fr) 1.5rem 1.5rem; padding-right: 0.9rem; }
  .score .half.r .nm { text-align: right; }
  .score .nm { font-size: 3.6rem; padding-top: 0.2rem; }
  .score .gm { font-size: 3.6rem; text-align: center; color: var(--on-ink-2); padding-top: 0.2rem; }
  .score .pt { font-size: 4.9rem; text-align: center; padding: 0.35rem 0 0.5rem; }
  .rally { position: absolute; left: 50%; top: 7.6rem; transform: translateX(-50%); padding: 0.6rem 1.3rem 0.7rem; display: flex; align-items: baseline; gap: 0.9rem; }
  .rally .d { font-size: 3.6rem; }

  .plate { position: absolute; bottom: 0; width: 27rem; padding: 1.1rem 1.4rem 1.3rem; }
  .plate.l { left: 0; }
  .plate.r { right: 0; }
  .plate .who { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 1rem; }
  .plate .who .fig { box-shadow: 0 0 0 0.2rem var(--cream); }
  .plate .who .d { font-size: 4rem; }
  .plate .contact .d { font-size: 3.5rem; }
</style>
</head>
<body>
<div class="views">
  <div class="scene" data-court="splitL"></div>
  <div class="scene" data-court="splitR"></div>
</div>
<div class="divider" aria-hidden="true"></div>
<div class="stage"><main class="frame"><div class="safe">

  <section class="score ink" role="group" aria-label="Score">
    <div class="half l">
      <span class="serve-mark"><span class="sr">Serving</span></span>
      <span class="fig c-apricot" aria-hidden="true"></span>
      <span class="nm d">Gustav</span><span class="gm d" aria-label="Games 3">3</span><span class="pt d paper" aria-label="Points 30">30</span>
    </div>
    <div class="half r">
      <span class="pt d paper" aria-label="Points 15">15</span><span class="gm d" aria-label="Games 2">2</span><span class="nm d">Ramy</span>
      <span class="fig hoop c-rose" aria-hidden="true"></span>
      <span class="serve-mark off"></span>
    </div>
  </section>
  <p class="rally ink"><span class="lab">Rally</span><span class="d">9</span></p>

  <section class="plate l ink" aria-label="Gustav, last shot">
    <p class="who"><span class="fig c-apricot" aria-hidden="true"></span><span class="d">Gustav</span></p>
    <div class="shot">
      <div class="strip" style="--at:52%" role="img" aria-label="Timing: on time"><i></i><i></i><i></i><b></b></div>
      <div class="strip-labs" aria-hidden="true"><span>Early</span><span>On time</span><span>Late</span></div>
      <p class="contact"><span class="face" style="--x:50%;--y:46%" aria-hidden="true"></span><span class="d">Sweet spot</span></p>
    </div>
  </section>

  <section class="plate r ink" aria-label="Ramy, last shot">
    <p class="who"><span class="fig hoop c-rose" aria-hidden="true"></span><span class="d">Ramy</span></p>
    <div class="shot">
      <div class="strip" style="--at:20%" role="img" aria-label="Timing: early"><i></i><i></i><i></i><b></b></div>
      <div class="strip-labs" aria-hidden="true"><span>Early</span><span>On time</span><span>Late</span></div>
      <p class="contact"><span class="face" style="--x:50%;--y:80%" aria-hidden="true"></span><span class="d">Throat</span></p>
    </div>
  </section>

</div></main></div>
<div class="grain" aria-hidden="true"></div>
<script src="court.js"></script>
</body>
</html>
